{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}

<div class="card p-4">
    <!-- <h3 class="mb-3">Welcome {{ name }} 👋</h3> -->

    <form action="{{ url_for('save_diary') }}" method="POST">
        <div class="mb-3">
            <input type="text" name="title" class="form-control" placeholder="Diary Title" required>
        </div>

        <div class="mb-3">
            <textarea name="content" class="form-control" placeholder="How are you feeling today?" required></textarea>
        </div>

        <button class="btn btn-primary w-100">Save Entry</button>
    </form>
</div>

{% endblock %}
