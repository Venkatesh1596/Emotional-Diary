<!DOCTYPE html>
<html>
<head>
    <title>Edit Diary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="box">
    <h2>Edit Diary</h2>

<p><b>Current Emotion:</b> {{ diary.emotion }}</p>
<p><b>Suggestion:</b> {{ diary.suggestion }}</p>

    <form method="POST">
        <input type="text" name="title" value="{{ diary.title }}" required>
        <textarea name="content" required>{{ diary.content }}</textarea>
        <button type="submit">Update</button>
    </form>

    <a href="{{ url_for('history') }}">Back</a>
</div>
</body>
</html>
